<style>
/* Shell on top of Yohaku, modelled on qingyi lab: fixed top bar and sidebar, one scroll container. */
:root { --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
.shell { height: 100vh; display: flex; flex-direction: column; }
.top { flex: none; height: 56px; display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6); border-bottom: var(--stroke-hairline) solid var(--line); }
.top .yh-logo small { color: var(--ink-secondary); font-weight: var(--weight-regular); }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); }
.agent { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--ink-secondary); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--success); display: inline-block; }
.frame { flex: 1 1 auto; min-height: 0; display: flex; }
.scroll { flex: 1 1 auto; min-width: 0; overflow: auto; }
.content { padding: var(--space-8) var(--space-10); display: flex; flex-direction: column; gap: var(--space-8); min-width: 0; }
.mock { flex: none; display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-1) var(--space-6); background: var(--ink); color: var(--ink-inverse); font-size: var(--text-xs); }
.mock a { color: inherit; opacity: .75; } .mock a:hover { opacity: 1; }

/* Sidebar: qingyi-lab groups (bold row + caret, indented sub rows, inset bar on the active row). */
.nav { flex: 0 0 248px; overflow-y: auto; border-right: var(--stroke-hairline) solid var(--line); padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); box-sizing: border-box; }
.nav-row { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--control-md); padding: 0 var(--space-3); box-sizing: border-box; border: 0; background: none;
  color: var(--ink); font: inherit; font-size: var(--text-md); text-align: left; text-decoration: none; cursor: pointer; border-radius: var(--radius-sm); white-space: nowrap; }
.nav-row:hover { background: var(--surface-sunken); }
.nav-group { font-weight: var(--weight-bold); margin-top: var(--space-3); }
.nav-group:first-child { margin-top: 0; }
.nav-group .caret { margin-left: auto; transition: transform var(--duration-base) var(--ease-standard); }
.nav-group[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.nav-sub { display: flex; flex-direction: column; gap: var(--space-1); padding-left: var(--space-8); }
.nav-sub[hidden] { display: none; }
.nav-sub .nav-row { color: var(--ink-secondary); }
.nav-sub .nav-row.is-active { color: var(--ink); font-weight: var(--weight-bold); box-shadow: inset var(--stroke-active) 0 0 var(--line-ink); border-radius: 0; }
.nav-row .n { margin-left: auto; font-size: var(--text-sm); color: var(--ink-tertiary); font-family: var(--font-num); }

/* Wide tables scroll sideways instead of squeezing; rows are roomy. */
.tbl-box { overflow-x: auto; border: var(--stroke-hairline) solid var(--line); }
.tbl-box .yh-table { min-width: 960px; }
.tbl-box .yh-table th, .tbl-box .yh-table td { padding: var(--space-4) var(--space-5); white-space: nowrap; }
.tbl-box .yh-table td.wrap { white-space: normal; min-width: 280px; }
.tbl-box .yh-table tbody tr { height: 64px; }
.tbl-box .yh-table tbody tr.click { cursor: pointer; }
.tbl-box .yh-table tbody tr.is-sel { background: var(--kinari); }
.tbl-box .yh-table tr:last-child td { border-bottom: 0; }
.sub { display: block; font-size: var(--text-sm); color: var(--ink-tertiary); margin-top: 2px; }
.mono { font-family: var(--font-mono); font-size: var(--text-sm); }
.id { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--ink-secondary); }
a.lnk { color: var(--ink); text-decoration: underline; text-underline-offset: var(--underline-offset); text-decoration-color: var(--line-strong); }
a.lnk:hover { text-decoration-color: var(--ink); }

/* Icon status with a hover tooltip (Yohaku .yh-tip shown on hover or focus). */
.yh-tip-anchor .yh-tip { display: none; white-space: normal; text-align: left; font-weight: var(--weight-regular); }
.yh-tip-anchor:hover .yh-tip, .yh-tip-anchor:focus-visible .yh-tip { display: block; }
.st { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-full); cursor: default; }
.st .yh-icon { width: 18px; height: 18px; }
.st--ok { color: var(--success); background: var(--success-soft); }
.st--warn { color: var(--on-beige); background: var(--kinari); }
.st--busy { color: var(--ink-secondary); background: var(--surface-sunken); }
.st--bad { color: var(--danger); background: var(--danger-soft); }
.st-row { display: inline-flex; align-items: center; gap: var(--space-3); }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: var(--text-3xl); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.page-head p { margin: var(--space-2) 0 0; color: var(--ink-secondary); font-size: var(--text-md); max-width: 760px; }
.page-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-top: var(--space-3); font-size: var(--text-sm); color: var(--ink-secondary); }
.actions { display: flex; gap: var(--space-3); flex: none; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.toolbar .yh-input-wrap { flex: 0 1 320px; }
.seg { display: inline-flex; gap: var(--space-2); flex-wrap: wrap; }
.seg .yh-tag { height: var(--control-sm); font-size: var(--text-sm); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: var(--space-6); align-items: start; }
@media (max-width: 1200px) { .split { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 0; }
.panel { border: var(--stroke-hairline) solid var(--line); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); background: var(--surface); }
.panel-head { display: flex; align-items: center; gap: var(--space-3); }
.panel-head .yh-btn { margin-left: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-6); margin: 0; font-size: var(--text-md); }
.kv dt { color: var(--ink-secondary); } .kv dd { margin: 0; }
.picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.pick { text-align: left; font: inherit; color: inherit; cursor: pointer; gap: var(--space-2); padding: var(--space-6); }
.pick:hover { border-color: var(--line-ink); }
.pick .yh-badge { align-self: flex-start; }
.steps { display: flex; flex-wrap: wrap; gap: var(--space-6); list-style: none; padding: 0 0 var(--space-3); margin: 0; border-bottom: var(--stroke-hairline) solid var(--line); counter-reset: s; }
.steps li { counter-increment: s; display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); color: var(--ink-tertiary); }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-full); border: var(--stroke-hairline) solid var(--line-strong); font-size: var(--text-sm); }
.steps li.is-done { color: var(--ink-secondary); } .steps li.is-done::before { content: "✓"; }
.steps li.is-current { color: var(--ink); font-weight: var(--weight-bold); } .steps li.is-current::before { background: var(--ink); color: var(--ink-inverse); border-color: var(--ink); }
.narrow { max-width: 880px; display: flex; flex-direction: column; gap: var(--space-6); }
.foot { display: flex; align-items: center; gap: var(--space-3); }
.foot .push { margin-left: auto; }
.shot { aspect-ratio: 16/10; border: var(--stroke-hairline) solid var(--line-subtle); display: grid; place-items: center; color: var(--ink-tertiary); font-size: var(--text-sm);
  background: repeating-linear-gradient(135deg, var(--surface-sunken) 0 8px, var(--surface) 8px 16px); }
.quote { margin: 0; padding: var(--space-3) var(--space-4); background: var(--surface-sunken); border-left: var(--stroke-active) solid var(--line-strong); font-size: var(--text-md); }
.yh-textarea.sm { min-height: 0; }
.progress { width: 240px; height: 6px; background: var(--line-subtle); position: relative; }
.progress span { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.yh-alert .yh-btn { margin-left: auto; flex: none; }
.lab-scrim { position: fixed; }
[hidden] { display: none !important; }
</style>
</head>

};

// ============================================================ router
const route = () => location.hash.replace(/^#\/?/, '') || 'suites';
function render() {
  const [a, b] = route().split('/');
  let html;
  if (a === 'suites' && b === 'new') html = V.wizard();
  else if (a === 'suites' && b) html = V.suite(b);
  else if (a === 'runs' && b) html = V.run(b);
  else html = (V[a] || V.suites)();
  document.documentElement.lang = lang;
  document.getElementById('view').innerHTML = html;
  document.getElementById('agent-text').textContent = t('agent');
  document.getElementById('mock-note').textContent = t('mock');
  renderNav(V[a] ? a : 'suites');
}
window.addEventListener('hashchange', () => { render(); document.querySelector('.scroll').scrollTo(0, 0); });
document.getElementById('lang').addEventListener('change', (e) => { lang = e.target.value; render(); });
document.addEventListener('click', (e) => {
  const x = e.target;
  const g = x.closest('[data-group]'); if (g) { openG[g.dataset.group] = !openG[g.dataset.group]; render(); return; }
  const pick = x.closest('[data-src]'); if (pick) { wiz.source = pick.dataset.src; render(); return; }
  const w = x.closest('[data-wiz]'); if (w) { const a = w.dataset.wiz; if (a === 'next') wiz.step++; if (a === 'back') wiz.step--; if (a === 'done') { wiz.step = 1; location.hash = '#/suites/ckweb-3366'; return; } render(); return; }
  const tab = x.closest('[data-tab]'); if (tab) { suiteTab = tab.dataset.tab; render(); return; }
  const cs = x.closest('[data-case]'); if (cs && !x.closest('label,input')) { selCase = cs.dataset.case; render(); return; }
  const tg = x.closest('.seg .yh-tag'); if (tg) { tg.parentElement.querySelectorAll('.yh-tag').forEach((b) => b.setAttribute('aria-pressed', String(b === tg))); return; }
  const d = x.closest('[data-dlg]'); if (d && !d.disabled) { document.getElementById('dlg').innerHTML = DLG[d.dataset.dlg](); document.getElementById('scrim').hidden = false; return; }
  if (x.closest('[data-close]') || x.id === 'scrim') { document.getElementById('scrim').hidden = true; return; }
  const tr = x.closest('tr[data-href]'); if (tr && !x.closest('a,button,input,label')) location.hash = tr.dataset.href;
});
render();
</script>
