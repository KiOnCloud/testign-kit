name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install pytest openpyxl

      - name: Run pytest
        run: python -m pytest -v

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run console UI unit tests
        run: node --test "scripts/testign/console/ui/tests/*.test.mjs"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace manifests
        run: claude plugin validate --strict .

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest openpyxl playwright

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run console browser tests
        run: TESTIGN_E2E=1 python -m pytest tests/e2e -v
