[project]
name = "testign"
version = "0.5.0"
description = "Deterministic helpers for the testign Claude Code plugin"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
